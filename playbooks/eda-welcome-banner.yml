---
- name: EDA Demo - Welcome New Host Banner
  hosts: all
  become: true
  tasks:
    - name: Ensure motd file exists
      ansible.builtin.file:
        path: /etc/motd
        state: touch

    - name: Ensure banner header is present
      ansible.builtin.blockinfile:
        path: /etc/motd
        marker: "# {mark} EDA DEMO HEADER"
        block: |
          =====================================================
          Event-Driven Automation Demo - NetBoxWebinar01
          =====================================================
        insertbefore: BOF

    - name: Append timestamped EDA trigger line
      ansible.builtin.lineinfile:
        path: /etc/motd
        line: "  [{{ ansible_date_time.iso8601 }}] Triggered by NetBox event"
        insertafter: EOF

    - name: Also drop a visible marker file for live tail demo
      ansible.builtin.copy:
        dest: "/tmp/eda-demo-triggered-{{ ansible_date_time.epoch }}.txt"
        content: "EDA fired at {{ ansible_date_time.iso8601 }}\n"
